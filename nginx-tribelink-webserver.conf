server {
	server_tokens off;

    listen 80;

	# Domain name and general config
	server_name tribelink.sytes.net;
	access_log /var/log/nginx/tribelink.access.log;
	error_log /var/log/nginx/tribelink.error.log;

    # Redirect to HTTPS
    return 301 https://$server_name$request_uri;
}
server {
	# disable server version in headers
	server_tokens off;

	# SSL config
	listen 443 ssl http2;
	listen [::]:443 ssl http2;
	ssl_certificate /etc/letsencrypt/live/tribelink.sytes.net/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/tribelink.sytes.net/privkey.pem;
	ssl_protocols TLSv1.3;

	# Domain name and general config
	server_name tribelink.sytes.net;
	access_log /var/log/nginx/tribelink.access.log;
	error_log /var/log/nginx/tribelink.error.log;

	root /var/www/tribelink/public;

	index index.php index.html;

	charset utf-8;

	## Hardened security headers (more at https://www.serpworx.com/check-security-headers/)
	# disable mime content sniffing
	add_header X-Content-Type-Options "nosniff" always;
	# no framing other than from same domain
	add_header X-Frame-Options "sameorigin" always;
	# prevent hotlinking
	add_header X-Permitted-Cross-Domain-Policies "none" always;
	# disallow robot indexing
	add_header X-Robots-Tag "noindex, nofollow" always;
	# prevent cross-site scripting
	add_header X-XSS-Protection "1; mode=block" always;


	# Config

	location / {
		try_files $uri $uri/ /index.php?$query_string;
	}

	location = /favicon.ico {
		access_log off;
		log_not_found off;
	}
	location = /robots.txt {
		access_log off;
		log_not_found off;
	}

	# Compression
	gzip_static on;

	## Cache options
	# Media: images, icons, video, audio, HTC
	location ~* \.(?:avif|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|mp3|ogg|ogv|webm|woff2|woff)$ {
		# store for 1 week before revalidating
		add_header Cache-Control "max-age=604800, must-revalidate";
	}
	# CSS and Javascript
	location ~* \.(?:css|js)$ {
		# cache it, but revalidate every time (https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Cache-Control#use_cases)
		add_header Cache-Control no-cache;
	}

	# 404 page
	error_page 404 /index.php;

	## PHP setup
	location ~ \.php$ {
		# regex to split $uri to $fastcgi_script_name and $fastcgi_path
		fastcgi_split_path_info ^(.+?\.php)(/.*)$;

		# Check that the PHP script exists before passing it
		try_files $fastcgi_script_name =404;

		# Bypass the fact that try_files resets $fastcgi_path_info
		# see: http://trac.nginx.org/nginx/ticket/321
		set $path_info $fastcgi_path_info;
		fastcgi_param PATH_INFO $path_info;

		fastcgi_index index.php;
		include fastcgi_params;

		fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;

		fastcgi_pass unix:/run/php/php-fpm.sock;
		fastcgi_read_timeout 180;

		# Hide PHP version
		fastcgi_hide_header X-Powered-By;
	}

	location ~ /\.(?!well-known).* {
		deny all;
	}
}
