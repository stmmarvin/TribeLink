<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="580" viewBox="0 0 1080 580" fill="none">
  <title>TribeLink</title>
  <defs>
    <!-- Pixel T: top bar runs navy → cyan, the stem gets darker downwards -->
    <linearGradient id="tl-bar" x1="28" y1="0" x2="500" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0E3667"/>
      <stop offset="0.5" stop-color="#028AB1"/>
      <stop offset="1" stop-color="#1FCBDF"/>
    </linearGradient>
    <linearGradient id="tl-stem" x1="0" y1="160" x2="0" y2="552" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0784B6"/>
      <stop offset="1" stop-color="#103663"/>
    </linearGradient>
    <!-- Link + L: navy on the left, cyan at the far right -->
    <linearGradient id="tl-link" x1="430" y1="0" x2="1060" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F3D6E"/>
      <stop offset="0.45" stop-color="#0794C1"/>
      <stop offset="1" stop-color="#05EEF1"/>
    </linearGradient>
    <linearGradient id="tl-l" x1="0" y1="40" x2="0" y2="446" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#07BCD6"/>
      <stop offset="1" stop-color="#06ACD0"/>
    </linearGradient>

    <!-- Where yellow passes over blue (top) the blue is cut, and vice versa (bottom) -->
    <mask id="tl-under-yellow" maskUnits="userSpaceOnUse" x="0" y="0" width="1080" height="580">
      <rect width="1080" height="580" fill="#fff"/>
      <path d="M470 98H480A157 182 0 0 1 609 384" stroke="#000" stroke-width="128"/>
    </mask>
    <mask id="tl-under-blue" maskUnits="userSpaceOnUse" x="0" y="0" width="1080" height="580">
      <rect width="1080" height="580" fill="#fff"/>
      <path d="M430 330A170 165 0 0 0 600 495H1060" stroke="#000" stroke-width="128"/>
      <path d="M590 40H850V445H750V145H680Z" fill="#000" stroke="#000" stroke-width="28" stroke-linejoin="round"/>
    </mask>
    <mask id="tl-outside-blue" maskUnits="userSpaceOnUse" x="0" y="0" width="1080" height="580">
      <rect width="1080" height="580" fill="#fff"/>
      <ellipse cx="600" cy="330" rx="184" ry="229" fill="#000"/>
    </mask>
  </defs>

  <!-- Yellow half of the link: top-right arc + bottom-left wedge -->
  <path d="M470 98H480A157 182 0 0 1 609 384" stroke="#FED53D" stroke-width="100" mask="url(#tl-under-blue)"/>
  <rect x="362" y="450" width="200" height="105" fill="#FEC737" mask="url(#tl-outside-blue)"/>

  <!-- Blue half of the link, flowing into the foot of the L -->
  <path d="M531 195A120 165 0 0 0 600 495H1060" stroke="url(#tl-link)" stroke-width="100" mask="url(#tl-under-yellow)"/>

  <!-- L with slanted flag -->
  <path d="M590 40H850V446H750V145H680Z" fill="url(#tl-l)"/>

  <!-- Pixel T -->
  <g fill="url(#tl-bar)">
    <rect x="28" y="40" width="32" height="32" rx="3"/><rect x="68" y="40" width="32" height="32" rx="3"/><rect x="108" y="40" width="32" height="32" rx="3"/><rect x="148" y="40" width="32" height="32" rx="3"/><rect x="188" y="40" width="32" height="32" rx="3"/><rect x="228" y="40" width="32" height="32" rx="3"/><rect x="268" y="40" width="32" height="32" rx="3"/><rect x="308" y="40" width="32" height="32" rx="3"/><rect x="348" y="40" width="32" height="32" rx="3"/><rect x="388" y="40" width="32" height="32" rx="3"/><rect x="428" y="40" width="32" height="32" rx="3"/>
    <rect x="28" y="80" width="32" height="32" rx="3"/><rect x="68" y="80" width="32" height="32" rx="3"/><rect x="108" y="80" width="32" height="32" rx="3"/><rect x="148" y="80" width="32" height="32" rx="3"/><rect x="188" y="80" width="32" height="32" rx="3"/><rect x="228" y="80" width="32" height="32" rx="3"/><rect x="268" y="80" width="32" height="32" rx="3"/><rect x="308" y="80" width="32" height="32" rx="3"/><rect x="348" y="80" width="32" height="32" rx="3"/><rect x="388" y="80" width="32" height="32" rx="3"/><rect x="468" y="80" width="32" height="32" rx="3"/>
    <rect x="28" y="120" width="32" height="32" rx="3"/><rect x="68" y="120" width="32" height="32" rx="3"/><rect x="108" y="120" width="32" height="32" rx="3"/><rect x="148" y="120" width="32" height="32" rx="3"/><rect x="188" y="120" width="32" height="32" rx="3"/><rect x="228" y="120" width="32" height="32" rx="3"/><rect x="268" y="120" width="32" height="32" rx="3"/><rect x="308" y="120" width="32" height="32" rx="3"/><rect x="348" y="120" width="32" height="32" rx="3"/><rect x="388" y="120" width="32" height="32" rx="3"/><rect x="428" y="120" width="32" height="32" rx="3"/>
  </g>
  <g fill="url(#tl-stem)">
    <rect x="228" y="160" width="32" height="32" rx="3"/><rect x="268" y="160" width="32" height="32" rx="3"/><rect x="308" y="160" width="32" height="32" rx="3"/>
    <rect x="228" y="200" width="32" height="32" rx="3"/><rect x="268" y="200" width="32" height="32" rx="3"/><rect x="308" y="200" width="32" height="32" rx="3"/>
    <rect x="228" y="240" width="32" height="32" rx="3"/><rect x="268" y="240" width="32" height="32" rx="3"/><rect x="308" y="240" width="32" height="32" rx="3"/>
    <rect x="228" y="280" width="32" height="32" rx="3"/><rect x="268" y="280" width="32" height="32" rx="3"/><rect x="308" y="280" width="32" height="32" rx="3"/>
    <rect x="228" y="320" width="32" height="32" rx="3"/><rect x="268" y="320" width="32" height="32" rx="3"/><rect x="308" y="320" width="32" height="32" rx="3"/>
    <rect x="228" y="360" width="32" height="32" rx="3"/><rect x="268" y="360" width="32" height="32" rx="3"/><rect x="308" y="360" width="32" height="32" rx="3"/>
    <rect x="228" y="400" width="32" height="32" rx="3"/><rect x="268" y="400" width="32" height="32" rx="3"/><rect x="308" y="400" width="32" height="32" rx="3"/>
    <rect x="228" y="440" width="32" height="32" rx="3"/><rect x="268" y="440" width="32" height="32" rx="3"/><rect x="308" y="440" width="32" height="32" rx="3"/>
    <rect x="228" y="480" width="32" height="32" rx="3"/><rect x="268" y="480" width="32" height="32" rx="3"/><rect x="308" y="480" width="32" height="32" rx="3"/>
    <rect x="228" y="520" width="32" height="32" rx="3"/><rect x="268" y="520" width="32" height="32" rx="3"/><rect x="308" y="520" width="32" height="32" rx="3"/>
  </g>
  <!-- Yellow "spark" pixel where the T meets the link -->
  <rect x="428" y="80" width="32" height="32" rx="3" fill="#FED53D"/>
</svg>
